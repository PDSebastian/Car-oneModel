spring:
  application:
    name: cars-app
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3311/cars_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8086

application:
  jwt:
    secretKey: ${JWT_SECRET_KEY:asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF}
    tokenExpirationAfterDays: 7

