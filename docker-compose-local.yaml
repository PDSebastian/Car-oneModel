services:
  mysql-server:
    image: mysql:8.4
    container_name: mysql_server5
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cars_app_db
    ports:
      - "3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped


  car-app:
    image: sebi123q/car-app-api:1.0
    container_name: car-app-api
    ports:
      - "8087:8086"
    environment:
      DB_URL: jdbc:mysql://mysql-server:3306/cars_app_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET_KEY: "asdasdasdasdasd123344asdasdasdasdasasd12321332sadasXYZ0123456789ABCDEF"
    depends_on:
      mysql-server:
        condition: service_healthy
    restart: unless-stopped


volumes:
  mysql_data:

